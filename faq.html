<script>
  // Same Google Sheet as the catalogue. Its "faq" tab (question | answer) replaces the default list;
  // its "settings" tab keeps the default answers in step with the live prices and pre-order date.
  const SHEET_TAB_URL = tab => `https://docs.google.com/spreadsheets/d/1-wnqefDebKtjV0jvCL7RW9KRSHVJ_56WMuBDDaMshDk/gviz/tq?tqx=out:json&sheet=${tab}`;
  // Fallbacks, matching the catalogue page.
  const DEFAULTS = {
    preorder_until: "2026-12-20", postage_semenanjung: "10", postage_sabah_sarawak: "45",
    box_pickup: "5", addon_paper_bag: "3"
  };

  const esc = s => String(s || "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const rm = v => "RM" + (parseFloat(String(v).replace(/[^\d.]/g, "")) || 0);

  function fetchText(url, ms = 6000) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), ms);
    return fetch(url, { cache: "no-store", signal: ctrl.signal })
      .then(res => {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.text();
      })
      .finally(() => clearTimeout(timer));
  }

  // A tab as rows of text, with Google's guessed header labels as the first row.
  async function tabRows(tab) {
    const text = await fetchText(SHEET_TAB_URL(tab));
    const table = JSON.parse(text.slice(text.indexOf("(") + 1, text.lastIndexOf(")"))).table;
    const cell = c => (c == null ? "" : String(c.f ?? c.v ?? "")).trim();
    return [table.cols.map(c => c.label || ""), ...table.rows.map(r => (r.c || []).map(cell))];
  }

  async function loadSettings() {
    try {
      const rows = await tabRows("settings");
      const below = name => {
        for (let r = 0; r < rows.length; r++) {
          const c = rows[r].findIndex(v => v.toLowerCase().split(/\s+/).includes(name));
          if (c >= 0) return ((rows[r + 1] || [])[c] || "").trim();
        }
        return null;
      };
      const date = below("preorder_until");
      if (date !== null) {
        const out = { preorder_until: date };
        for (const k of Object.keys(DEFAULTS)) if (k !== "preorder_until") out[k] = below(k) || DEFAULTS[k];
        return out;
      }
    } catch (e) {
      console.warn("Could not load settings", e);
    }
    return DEFAULTS;
  }

  const MONTHS = ["jan", "feb", "mar", "apr", "may", "jun", "jul", "aug", "sep", "oct", "nov", "dec"];
  // The pre-order date as "20 December 2026", or "" when none is set or it has passed.
  function preorderText(value) {
    const s = (value || "").trim();
    let m, d = null;
    if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) d = [+m[1], +m[2], +m[3]];
    else if ((m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/))) d = +m[2] > 12 ? [+m[3], +m[1], +m[2]] : [+m[3], +m[2], +m[1]];
    else if ((m = s.match(/^(\d{1,2})\s+([a-z]+)\s*,?\s*(\d{4})$/i)) && MONTHS.includes(m[2].slice(0, 3).toLowerCase())) d = [+m[3], MONTHS.indexOf(m[2].slice(0, 3).toLowerCase()) + 1, +m[1]];
    else if ((m = s.match(/^([a-z]+)\s+(\d{1,2})\s*,?\s*(\d{4})$/i)) && MONTHS.includes(m[1].slice(0, 3).toLowerCase())) d = [+m[3], MONTHS.indexOf(m[1].slice(0, 3).toLowerCase()) + 1, +m[2]];
    if (!d) return "";
    const end = new Date(Date.UTC(d[0], d[1] - 1, d[2], 15, 59, 59));
    return !isNaN(end) && Date.now() <= end
      ? end.toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric", timeZone: "Asia/Kuala_Lumpur" })
      : "";
  }

  function defaultFaq(st) {
    const preorder = preorderText(st.preorder_until);
    return [
      { q: "What batteries do the lamps use? 🔋", a: "Small round button cell (coin) batteries." },
      { q: "The batteries ran out. Can I replace them?", a: "Yes! You can buy new ones at DIY stores (e.g. Mr DIY) and swap them in." },
      { q: "What does \"USB + LED\" mean?", a: "The big flower on top is a table lamp powered by USB, and the small flower below has its own LED lights." },
      { q: "When will I get my lamp?", a: preorder ? `All our lamps are made to order 🌷 This batch will be posted by ${preorder}.` : "Every lamp is handmade to order. We'll let you know the ready date on WhatsApp." },
      { q: "Can I pick it up myself?", a: `Yes! Self pickup at Taman Sentosa, Klang is FREE. Just choose a box (${rm(st.box_pickup)}) or window paper bag (${rm(st.addon_paper_bag)}) for each lamp.` },
      { q: "How much is postage?", a: `Semenanjung ${rm(st.postage_semenanjung)} and Sabah / Sarawak ${rm(st.postage_sabah_sarawak)} for each lamp.` },
      { q: "How do I pay?", a: "Scan our DuitNow QR in the order form, pay the total, then send your receipt in WhatsApp." },
      { q: "Can I request my own flower or colour? 🎀", a: "Yes, we love custom orders! WhatsApp us your favourite flower, colours or a photo, and we'll see what we can make." }
    ];
  }

  async function sheetFaq() {
    try {
      const rows = await tabRows("faq");
      // Without a faq tab Google returns the first tab, which has no question/answer columns.
      const h = rows.findIndex(r => r.some(v => /question/i.test(v)) && r.some(v => /answer/i.test(v)));
      if (h >= 0) {
        const qi = rows[h].findIndex(v => /question/i.test(v)), ai = rows[h].findIndex(v => /answer/i.test(v));
        const list = rows.slice(h + 1).map(r => ({ q: r[qi] || "", a: r[ai] || "" })).filter(f => f.q && f.a);
        if (list.length) return list;
      }
    } catch (e) {
      console.warn("Could not load FAQ", e);
    }
    return null;
  }

  function render(list) {
    document.getElementById("faqList").innerHTML = list
      .map(f => `<details><summary>${esc(f.q)}</summary><p>${esc(f.a)}</p></details>`).join("");
  }

  (async () => {
    const [st, own] = await Promise.all([loadSettings(), sheetFaq()]);
    render(own || defaultFaq(st));
  })();
</script>
