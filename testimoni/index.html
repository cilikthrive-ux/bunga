<style>
  :root {
    --cream: #fff8ea;
    --pink: #fbe4e6;
    --pink-deep: #f6d3d8;
    --card: #fffdf8;
    --rose: #c27c88;
    --rose-dark: #a05c69;
    --sage: #7d846b;
    --text: #5a4446;
    --muted: #8d7a7b;
    --line: #f1dcd8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background:
      radial-gradient(circle at 10% 0%, var(--pink) 0, transparent 40%),
      radial-gradient(circle at 95% 30%, var(--pink) 0, transparent 30%),
      var(--cream);
    color: var(--text);
    font-family: "Nunito", system-ui, sans-serif;
    line-height: 1.6;
  }
  img { max-width: 100%; display: block; }

  header { text-align: center; padding: 20px 16px 4px; }
  .site-nav { display: flex; justify-content: center; gap: 4px; flex-wrap: wrap; padding: 12px 12px 0; }
  .site-nav a { color: var(--rose-dark); text-decoration: none; font-weight: 700; font-size: .9rem; padding: 6px 14px; border-radius: 999px; }
  .site-nav a:hover { background: var(--pink); }
  .site-nav a[aria-current="page"] { background: var(--rose); color: #fff; }
  header img { width: 90px; height: 90px; border-radius: 50%; margin: 14px auto 0; box-shadow: 0 6px 18px rgba(194, 124, 136, .2); }
  h1 { font-family: "Great Vibes", cursive; font-weight: 400; font-size: 2.8rem; color: var(--rose-dark); margin: 8px 0 0; line-height: 1.1; }
  .sub { font-family: "Cormorant Garamond", serif; font-style: italic; font-size: 1.2rem; color: var(--sage); margin: 2px 0 0; }
  .summary { margin: 10px 0 0; color: var(--muted); font-weight: 700; }
  .summary .stars { color: #e0a43a; letter-spacing: 2px; }

  main { max-width: 1040px; margin: 24px auto 0; padding: 0 16px; columns: 3 280px; column-gap: 16px; }
  .review {
    break-inside: avoid; margin: 0 0 16px;
    background: var(--card); border: 1px solid var(--line); border-radius: 18px; overflow: hidden;
    box-shadow: 0 6px 18px rgba(194, 124, 136, .08);
  }
  .review img { width: 100%; height: auto; aspect-ratio: 4 / 5; object-fit: cover; object-position: 50% 30%; cursor: zoom-in; background: var(--pink); }
  .review .body { padding: 14px 16px 16px; }
  .review .stars { color: #e0a43a; letter-spacing: 2px; font-size: .95rem; }
  .review p { margin: 6px 0 10px; white-space: pre-line; }
  .review .who { font-weight: 700; font-size: .9rem; }
  .review .what { color: var(--muted); font-size: .8rem; }
  .empty, .loading { column-span: all; text-align: center; color: var(--muted); padding: 30px 0; }

  .cta { text-align: center; padding: 20px 16px 48px; }
  .btn {
    display: inline-block; background: var(--rose); color: #fff; border-radius: 999px;
    padding: 12px 26px; font-weight: 700; text-decoration: none;
    box-shadow: 0 6px 16px rgba(194, 124, 136, .3);
  }
  .btn:hover { background: var(--rose-dark); }
  .socials { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin: 24px 0 0; }
  .socials a {
    text-decoration: none; color: var(--rose-dark); font-weight: 700; font-size: .85rem;
    background: var(--card); border: 1px solid var(--pink-deep); border-radius: 999px; padding: 6px 14px;
  }

  .lightbox {
    position: fixed; inset: 0; z-index: 20; background: rgba(60, 40, 42, .85);
    display: none; align-items: center; justify-content: center; padding: 16px; cursor: zoom-out;
  }
  .lightbox.open { display: flex; }
  .lightbox img { max-height: 90vh; max-width: 100%; border-radius: 14px; }
</style>

<body>

<header>

<main id="reviews"><p class="loading">Loading reviews… 🌷</p></main>

<div class="lightbox" id="lightbox" role="dialog" aria-label="Full photo"><img alt=""></div>

<script>
  // Reviews live in the "testimoni" tab of the shop's Google Sheet:
  // name | review | photo (Google Drive link, optional) | product (optional) | stars (1-5, optional, default 5)
  const SHEET = "https://docs.google.com/spreadsheets/d/1-wnqefDebKtjV0jvCL7RW9KRSHVJ_56WMuBDDaMshDk/gviz/tq?tqx=out:json&sheet=testimoni";

  // Real messages from customers on WhatsApp, shown until the Sheet's testimoni tab has reviews of its own.
  const DEFAULT_REVIEWS = [
    { name: "Happy customer · WhatsApp", product: "White Tulip", stars: 5, photo: "photos/white-tulip-desk.jpg",
      review: "Dah sampai awaaaa 🥹 Sukewww, mekaseyhhh! Nanti akan repeat lagiii, nak cari design bunga lain pulak ❤️" },
    { name: "Happy customer · WhatsApp", product: "Tiger Lily in Pink", stars: 5, photo: "photos/tiger-lily-pink-hand.jpg",
      review: "Terima kasih banyak awak, cantik sangattt. Ada rezeki saya order lagi dengan awak yaa ❤️" },
    { name: "Happy customer · WhatsApp", product: "Signature Plum with Red Lily", stars: 5, photo: "photos/signature-plum-hand.jpg",
      review: "Dah sampai and is freaking pretty 🥹🥹🥹 Thank you for the gift too, that one also prettyy!! She loves it so much." },
    { name: "Happy customer · WhatsApp", product: "Lily of the Valley with Lotus", stars: 5, photo: "photos/lily-valley-lotus-night.jpg",
      review: "So beautifulll 😍 Thank you dear!" }
  ];

  const esc = s => String(s || "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const stars = n => "★".repeat(n) + "☆".repeat(5 - n);

  function photoUrl(link) {
    if (!link) return "";
    const drive = link.match(/drive\.google\.com\/.*(?:\/d\/|[?&]id=)([\w-]{20,})/);
    return drive ? `https://drive.google.com/thumbnail?id=${drive[1]}&sz=w800` : link;
  }

  async function load() {
    try {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 8000);
      const res = await fetch(SHEET, { cache: "no-store", signal: ctrl.signal });
      clearTimeout(timer);
      if (!res.ok) throw new Error("HTTP " + res.status);
      const text = await res.text();
      const table = JSON.parse(text.slice(text.indexOf("(") + 1, text.lastIndexOf(")"))).table;
      const cell = c => (c == null ? "" : String(c.f ?? c.v ?? "")).trim();
      const rows = [table.cols.map(c => c.label || ""), ...table.rows.map(r => (r.c || []).map(cell))];
      // Without a testimoni tab Google returns the first tab, which has no "review" column.
      const h = rows.findIndex(r => r.some(v => /review/i.test(v)));
      const col = name => h < 0 ? -1 : rows[h].findIndex(v => new RegExp(name, "i").test(v));
      const [ni, ri, pi, wi, si] = ["name", "review", "photo", "product", "star"].map(col);
      const list = h < 0 ? [] : rows.slice(h + 1)
        .filter(r => r[ri])
        .map(r => ({
          name: r[ni] || "Happy customer",
          review: r[ri],
          photo: photoUrl(r[pi]),
          product: r[wi] || "",
          stars: Math.max(1, Math.min(5, parseInt(r[si], 10) || 5))
        }));

      show(list.length ? list : DEFAULT_REVIEWS);
    } catch (e) {
      console.warn("Could not load reviews", e);
      show(DEFAULT_REVIEWS);
    }
  }

  function show(list) {
    const avg = list.reduce((t, r) => t + r.stars, 0) / list.length;
    const summary = document.getElementById("summary");
    summary.innerHTML = `<span class="stars">${stars(Math.round(avg))}</span> ${avg.toFixed(1)} from ${list.length} review${list.length === 1 ? "" : "s"}`;
    summary.hidden = false;
    document.getElementById("reviews").innerHTML = list.map(r => `
        <article class="review">
          ${r.photo ? `<img src="${esc(r.photo)}" alt="Photo from ${esc(r.name)}" loading="lazy" onerror="this.remove()">` : ""}
          <div class="body">
            <div class="stars" aria-label="${r.stars} out of 5 stars">${stars(r.stars)}</div>
            <p>${esc(r.review)}</p>
            <div class="who">${esc(r.name)}</div>
            ${r.product ? `<div class="what">${esc(r.product)}</div>` : ""}
          </div>
        </article>`).join("");
  }

  const lightbox = document.getElementById("lightbox");
  document.getElementById("reviews").addEventListener("click", e => {
    if (e.target.matches(".review img")) {
      lightbox.querySelector("img").src = e.target.src;
      lightbox.classList.add("open");
    }
  });
  lightbox.addEventListener("click", () => lightbox.classList.remove("open"));
  document.addEventListener("keydown", e => { if (e.key === "Escape") lightbox.classList.remove("open"); });

  load();
</script>
<script src="../assets/music.js" defer></script>
