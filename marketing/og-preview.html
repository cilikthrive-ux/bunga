<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&family=Great+Vibes&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; overflow: hidden; font-family: Nunito, sans-serif;
    background: radial-gradient(circle at 85% 10%, #fbe4e6 0, transparent 45%), radial-gradient(circle at 70% 95%, #fbe4e6 0, transparent 40%), #fff8ea;
    display: flex; align-items: center; padding: 0 0 0 36px; gap: 26px; }
  .photos { display: flex; gap: 12px; align-items: flex-start; }
  .photos img { width: 200px; height: 356px; object-fit: cover; border-radius: 26px; box-shadow: 0 12px 30px rgba(160,92,105,.22); }
  .photos img:nth-child(2) { margin-top: 70px; }
  .text { flex: 1; text-align: center; padding-right: 28px; }
  .logo { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; box-shadow: 0 8px 22px rgba(194,124,136,.25); }

  .tag { font-family: "Cormorant Garamond", serif; font-style: italic; font-size: 26px; color: #7d846b; margin-top: 6px; }
  .pill { display: inline-block; margin-top: 22px; background: #c27c88; color: #fff; font-weight: 800; font-size: 21px; padding: 11px 22px; border-radius: 999px; }
  .meta { margin-top: 14px; color: #8d7a7b; font-size: 20px; font-weight: 700; }
</style></head><body>
  <div class="photos">
    <img src="/home/user/bunga/images/tiger-lily-pink.jpg">
    <img src="/home/user/bunga/images/tangled-yellow.jpg">

  </div>
  <div class="text">
    <img class="logo" src="/home/user/bunga/images/logo.jpg">
    <h1>Précious Nuha Bloom</h1>
    <p class="tag">Where flowers bloom and magic glows ✨</p>
    <p class="pill">Handmade flower lamps · from RM35</p>
    <p class="meta">🌷 Order via WhatsApp · Klang 📍</p>
  </div>
</body></html>
